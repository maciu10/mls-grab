# /etc/nginx/sites-available/mls-grab  (install.sh fills in the placeholders)
server {
    listen 80;
    server_name __SERVER_NAME__;

    root __WEB_ROOT__;
    index index.php;

    # The tool fetches third-party sites on demand, so keep it private.
    auth_basic           "mls-grab";
    auth_basic_user_file /etc/nginx/mls-grab.htpasswd;

    client_max_body_size 1m;

    location = / { rewrite ^ /index.php last; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass __PHP_FPM__;
        fastcgi_read_timeout 300;   # a lookup + download can take a minute or two
    }

    # Downloaded photos and ZIPs: static files only, never executed.
    location /jobs/ {
        location ~ \.php$ { return 403; }
        add_header X-Content-Type-Options nosniff;
        expires 7d;
    }

    location ~ /\. { deny all; }
    location ~ \.php$ { return 404; }   # only index.php is an entry point (config.php stays private)
}
